# Greek display labels for the hoteliers' blind evaluation (PROTOCOL.md version 1, §2). Both systems' outputs are
# rendered through this one table, so the wording cannot tell them apart. Each measure translates catalogue_v2's;
# structural types have no measure there and show the same note here.
version: labels_el_v1
catalogue: catalogue_v2
departments:
  housekeeping: Υπηρεσία ορόφων
  maintenance: Συντήρηση
  reception: Υποδοχή
  food_and_beverage: Εστίαση
  management: Διοίκηση
  other: Άλλο τμήμα
priorities:
  urgent: ΕΠΕΙΓΟΝ
  routine: Τακτικό
  structural: Ενημέρωση
deadlines:
  before the next arrival: πριν την επόμενη άφιξη
  today: σήμερα
  within 3 days: εντός 3 ημερών
  within 7 days: εντός 7 ημερών
structural_measure: Ενημέρωση της διοίκησης για τις τάσεις· καμία άμεση ενέργεια.
types:
  cleanliness:
    label: Καθαριότητα
    measure: Νέος καθαρισμός και έλεγχος του δωματίου πριν την επόμενη άφιξη· αλλαγή των λερωμένων λευκών ειδών.
  pests:
    label: Έντομα ή τρωκτικά
    measure: Το δωμάτιο βγαίνει εκτός διάθεσης· έλεγχος από απεντομωτή και αντιμετώπιση πριν ξαναδοθεί.
  security_fault:
    label: Βλάβη κλειδαριάς, πόρτας, παραθύρου ή χρηματοκιβωτίου
    measure: Επισκευή ή αντικατάσταση της κλειδαριάς, πόρτας, παραθύρου ή χρηματοκιβωτίου και δοκιμή πριν την επόμενη άφιξη.
  safety_fault:
    label: Κίνδυνος τραυματισμού ή βλάβη πυρασφάλειας
    measure: Έλεγχος του εξοπλισμού σήμερα, ασφαλής κατάσταση ή εκτός χρήσης, και επισκευή πριν την επόμενη άφιξη.
  safety_incident:
    label: Περιστατικό ασφάλειας (κλοπή, τραυματισμός, φωτιά)
    measure: Καταγραφή του περιστατικού σήμερα, επικοινωνία με τον επισκέπτη και αναφορά περιστατικού· για κλοπή, η διαδικασία κλοπής.
  hvac_failure:
    label: Κλιματισμός ή θέρμανση
    measure: Έλεγχος και επισκευή της μονάδας (φίλτρο, θερμοστάτης, ψυκτικό) και δοκιμή πριν την επόμενη άφιξη.
  plumbing_major:
    label: Σοβαρό υδραυλικό (ζεστό νερό, διαρροή, τουαλέτα)
    measure: Επισκευή της βλάβης και δοκιμή του νερού και της τουαλέτας πριν την επόμενη άφιξη.
  plumbing_minor:
    label: Μικρό υδραυλικό
    measure: Προγραμματισμός ελέγχου στον εβδομαδιαίο γύρο συντήρησης.
  equipment_fault:
    label: Βλάβη εξοπλισμού
    measure: Επισκευή ή αντικατάσταση και καταγραφή στο βιβλίο συντήρησης.
  wifi:
    label: Wi-Fi
    measure: Έλεγχος του σήματος στο δωμάτιο ή στον χώρο και αναφορά στον πάροχο αν είναι αδύναμο.
  noise_internal:
    label: Θόρυβος μέσα στο κτίριο
    measure: Εντοπισμός της πηγής· αν είναι εξοπλισμός, δελτίο συντήρησης· αν είναι επισκέπτες ή προσωπικό, ενημέρωση της νυχτερινής βάρδιας και σημείωση του δωματίου για πιο ήσυχη κατανομή.
  linen_amenities:
    label: Λευκά είδη, παροχές ή προετοιμασία δωματίου
    measure: Υπενθύμιση του προτύπου στην ομάδα ορόφου και έλεγχος των παροχών του δωματίου στην επόμενη υπηρεσία.
  bed_comfort:
    label: Άνεση κρεβατιού
    measure: Έλεγχος στρώματος και μαξιλαριών· προσφορά επιστρώματος ή άλλων μαξιλαριών· σήμανση φθαρμένου στρώματος για αντικατάσταση.
  food_beverage:
    label: Φαγητό ή ποτό
    measure: Επισκόπηση με τον υπεύθυνο κουζίνας ή μπαρ στην εβδομαδιαία σύσκεψη εστίασης.
  staff_service:
    label: Εξυπηρέτηση προσωπικού
    measure: Επισκόπηση με τον υπεύθυνο βάρδιας και απάντηση στον επισκέπτη για ό,τι έγινε.
  checkin_billing:
    label: Check-in, κράτηση ή χρέωση
    measure: Έλεγχος της κράτησης και του λογαριασμού· διόρθωση και επιστροφή λάθος χρέωσης και απάντηση στον επισκέπτη.
  other_problem:
    label: Άλλο πρόβλημα
    measure: Ο διευθυντής διαβάζει την κριτική και την αναθέτει σε τμήμα.
  noise_external:
    label: Θόρυβος από έξω
  room_and_facilities:
    label: Δωμάτιο και εγκαταστάσεις
  location_view:
    label: Τοποθεσία ή θέα
  price_value:
    label: Τιμή και αξία
