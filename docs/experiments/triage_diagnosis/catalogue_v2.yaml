# Problem-type catalogue, version 2. Its rules were decided, and this text approved, by the owner on 2 November
# 2026. catalogue_v1 stays as it was and is still the catalogue of the closed triage diagnosis protocol
# (versions 1-6); version 2 is for a later protocol, and any change to it is catalogue_v3, not an edit.
#
# What changed from v1, each from a ruling on a disagreement between the owner's hand labels and the teacher's
# on the 100 check reviews (items in docs/experiments/triage_diagnosis/samples/check_key.csv):
#   1. Dirt or a bad smell in the room is cleanliness whatever its cause (wear, ventilation, building work);
#      room_and_facilities is added when the room is also worn or dated. (items 12, 67, 86, 90)
#   2. AC or heating that is too weak, or a room reported too hot or too cold, is hvac_failure; a hotel with no
#      AC or heating at all stays structural. (items 1, 22, 32, 45)
#   3. A toilet that keeps running is plumbing_major; gurgling or knocking pipes are plumbing_minor, not
#      noise_internal. (items 23, 38)
#   4. safety_hazard is split: safety_fault (an injury risk from the building or its equipment, and faulty
#      fire-safety equipment; maintenance) and safety_incident (theft, an injury that happened, a fire or smoke
#      event, a blocked exit; management). (items 50, 60)
#   5. A smoke alarm going off with no cause is safety_fault: urgent, maintenance. (item 50)
#   6. security_fault is only a broken door, lock, window or safe: key cards not activated or blocked are
#      checkin_billing, and a window left open on arrival is linen_amenities (room preparation). (items 2, 53)
#   7. Every problem the guest reports is labelled, even a mild one; none only when no problem is reported.
#      (items 1, 22)
# These 100 check reviews shaped version 2, so they cannot test a system built on it.
#
# Priority: urgent = flagged first, measure due before the room's next arrival (the fault probably
# still affects the next guest); routine = the department's weekly review; structural = no
# operational measure, sent to management as information and counted for trends.
version: catalogue_v2
status: approved
departments: [reception, housekeeping, maintenance, food_and_beverage, management, other]

labelling_rules:
  - Label a type when the guest reports the problem as having happened during the stay, in either field.
  - Label every problem the guest reports, even a mild one or one the guest says did not spoil the stay. Use none only when the review reports no problem at all.
  - A problem the hotel fixed during the stay is still labelled; the department still needs to know.
  - Do not label praise, hypotheticals ("if the AC broke..."), or wishes ("a kettle would be nice").
  - One review can carry several types; label each distinct problem once. The empty set is allowed.
  - When two types fit, label the more specific one (e.g. a leaking shower is plumbing_major, not equipment_fault).
  - If no type fits a real operational problem, use other_problem.

types:
  # --- Urgent: the owner's four (cleanliness, pests, safety and security, AC/heating) plus plumbing_major;
  # safety and security are three types: security_fault, safety_fault, safety_incident.
  - id: cleanliness
    priority: urgent
    department: housekeeping
    definition: Dirt, stains, dust, hair, mould, or a bad or musty smell in the room, bathroom or bedding, whatever its cause (wear, poor ventilation, building work). If the room is also worn or dated, add room_and_facilities.
    excludes: A smell from a drain or leak (plumbing_major); worn or old decor with no dirt or smell (room_and_facilities).
    measure: Re-clean and inspect the room before the next arrival; replace any stained linen.
    deadline: before the next arrival
    to_confirm: [room number, whether the room is occupied]
  - id: pests
    priority: urgent
    department: housekeeping
    definition: Insects, bed bugs, cockroaches, ants, mice or rats seen in the room or the hotel.
    excludes: Mosquitoes coming in from outside through an open window with no screen (room_and_facilities).
    measure: Take the room out of sale, call pest control for an inspection, and treat before reletting.
    deadline: today
    to_confirm: [room number, which pest, date of stay]
  - id: security_fault
    priority: urgent
    department: maintenance
    definition: A door, lock, window or in-room safe that is broken, so it does not close, lock or open as it should.
    excludes: Key cards not activated or blocked (checkin_billing); a window left open on arrival (linen_amenities); theft (safety_incident); an injury risk (safety_fault).
    measure: Repair or replace the lock, door, window or safe, and test it before the next arrival.
    deadline: before the next arrival
    to_confirm: [room number, which fitting]
  - id: safety_fault
    priority: urgent
    department: maintenance
    definition: An injury risk from the building or its equipment (a dangerous or slippery bath or shower, broken stairs, loose wiring, broken glass), or fire-safety equipment that does not work as it should (a smoke alarm going off with no cause, a missing extinguisher).
    excludes: Theft, an injury that happened, or a fire or smoke event (safety_incident); a broken lock or safe (security_fault).
    measure: Inspect the reported fitting or equipment today, make it safe or take it out of use, and repair it before the next arrival.
    deadline: today
    to_confirm: [room number or location, which fitting or equipment]
  - id: safety_incident
    priority: urgent
    department: management
    definition: Theft, an injury that happened, a fire or smoke event, or a blocked emergency exit.
    excludes: An injury risk or a faulty alarm with no incident (safety_fault); a broken lock or safe with no theft (security_fault).
    measure: Record the incident today, contact the guest, and open an incident report; for theft, follow the theft procedure.
    deadline: today
    to_confirm: [location in the hotel, date of stay, whether a report was filed]
  - id: hvac_failure
    priority: urgent
    department: maintenance
    definition: The air conditioning or heating is present but does not work or is too weak to bring the room to a usable temperature; a room reported too hot or too cold counts here even if the guest does not name the equipment.
    excludes: A hotel or room with no AC or heating at all (room_and_facilities); AC that works but is noisy (noise_internal).
    measure: Check and repair the unit (filter, thermostat, refrigerant) and test it before the next arrival.
    deadline: before the next arrival
    to_confirm: [room number, AC or heating]
  - id: plumbing_major
    priority: urgent
    department: maintenance
    definition: No hot water, an active leak or flood, a blocked or broken toilet or one that keeps running, or a sewage smell.
    excludes: A slow drain, weak pressure, or gurgling or knocking pipes (plumbing_minor).
    measure: Repair the fault and run the water and toilet before the next arrival.
    deadline: before the next arrival
    to_confirm: [room number, which fixture]

  # --- Routine
  - id: plumbing_minor
    priority: routine
    department: maintenance
    definition: A slow drain, weak water pressure, a shower that is hard to control, lukewarm water, or gurgling or knocking pipes.
    excludes: No hot water, leaks, or a broken or running toilet (plumbing_major).
    measure: Schedule a check of the fixture in the weekly maintenance round.
    deadline: within 7 days
    to_confirm: [room number, which fixture]
  - id: equipment_fault
    priority: routine
    department: maintenance
    definition: Broken or faulty equipment or furniture other than plumbing, AC or locks (TV, lights, lift, kettle, fridge, hairdryer, curtains).
    excludes: Wi-Fi (wifi); AC or heating (hvac_failure); locks and safes (security_fault); injury risks and fire-safety equipment (safety_fault).
    measure: Repair or replace the item and record it in the maintenance log.
    deadline: within 3 days
    to_confirm: [room number or area, which item]
  - id: wifi
    priority: routine
    department: maintenance
    definition: Wi-Fi that is slow, drops, is unavailable in the room, or is charged for unexpectedly.
    excludes: none
    measure: Test the signal in the reported room or area and report the result to the provider if weak.
    deadline: within 7 days
    to_confirm: [room number or area]
  - id: noise_internal
    priority: routine
    department: reception
    definition: Noise from inside the building (neighbours, corridor, staff, events, lift, AC or other equipment).
    excludes: Street, traffic, nightlife or construction outside (noise_external); gurgling or knocking pipes (plumbing_minor).
    measure: Identify the source; if equipment, open a maintenance ticket; if guests or staff, brief the night shift and note the room for quieter allocation.
    deadline: within 3 days
    to_confirm: [room number, time of night, source if known]
  - id: linen_amenities
    priority: routine
    department: housekeeping
    definition: Towels, bedding or toiletries missing or not replaced, or the room not prepared or serviced as expected (for example a window left open on arrival).
    excludes: Stained or dirty linen (cleanliness).
    measure: Remind the floor team of the service standard and check the room's supplies at the next service.
    deadline: within 3 days
    to_confirm: [room number, which item]
  - id: bed_comfort
    priority: routine
    department: housekeeping
    definition: An uncomfortable, sagging or noisy bed or mattress, or poor pillows.
    excludes: Bed bugs (pests); dirty bedding (cleanliness).
    measure: Inspect the mattress and pillows; offer a topper or other pillows; flag a worn mattress for replacement.
    deadline: within 7 days
    to_confirm: [room number]
  - id: food_beverage
    priority: routine
    department: food_and_beverage
    definition: Poor quality, variety, temperature or service of breakfast, restaurant or bar food and drink.
    excludes: Breakfast price alone (price_value); breakfast hours as a policy (room_and_facilities).
    measure: Review the reported item with the kitchen or bar manager at the weekly F&B meeting.
    deadline: within 7 days
    to_confirm: [meal, date]
  - id: staff_service
    priority: routine
    department: reception
    definition: Staff who were rude, unhelpful or slow, or a request or complaint left unanswered.
    excludes: Billing or check-in errors (checkin_billing).
    measure: Review the case with the shift supervisor and reply to the guest with what was done.
    deadline: within 3 days
    to_confirm: [date, time, which desk or department]
  - id: checkin_billing
    priority: routine
    department: reception
    definition: Check-in or check-out delays, a wrong or downgraded room, a lost booking, key cards not activated or blocked, or an incorrect charge or deposit.
    excludes: The price being high in general (price_value).
    measure: Check the booking and the folio; correct and refund any wrong charge and reply to the guest.
    deadline: within 3 days
    to_confirm: [booking reference, date]
  - id: other_problem
    priority: routine
    department: other
    definition: A real operational problem that fits no other type.
    excludes: Structural complaints (the four structural types).
    measure: The manager reads the review and assigns it to a department.
    deadline: within 7 days
    to_confirm: []

  # --- Structural: no operational measure.
  - id: noise_external
    priority: structural
    department: management
    definition: Noise from outside the building (street, traffic, nightlife, trains, construction).
    excludes: Noise from inside the building (noise_internal).
    measure: null
    deadline: null
    to_confirm: []
  - id: room_and_facilities
    priority: structural
    department: management
    definition: Room size or layout, dated or worn decor and furniture, no lift, no AC or heating at all, no parking or pool, breakfast hours or other policies.
    excludes: Anything broken (the matching fault type); dirt or a bad smell (cleanliness, with this type added when the room is also worn).
    measure: null
    deadline: null
    to_confirm: []
  - id: location_view
    priority: structural
    department: management
    definition: The location, neighbourhood, distance from the centre or transport, or the view.
    excludes: none
    measure: null
    deadline: null
    to_confirm: []
  - id: price_value
    priority: structural
    department: management
    definition: The price, or extras such as breakfast or parking, judged too high for what was offered.
    excludes: An incorrect charge (checkin_billing).
    measure: null
    deadline: null
    to_confirm: []

# The fixed mapping for the complaint-lexicon-v1 baseline (PROTOCOL.md section 4): lexicon topic -> type.
lexicon_mapping:
  bathroom: plumbing_major
  cleanliness: cleanliness
  air_conditioning: hvac_failure
  pests: pests
  responsiveness: staff_service
