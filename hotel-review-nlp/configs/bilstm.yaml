# Pure-PyTorch BiLSTM baseline (custom training loop, no Trainer)
seed: 42

data:
  processed_dir: data/processed
  max_tokens: 220
  min_freq: 2
  embedding_dim: 128
  glove: null            # e.g. "data/raw/glove.6B.100d.txt" to warm-start

model:
  hidden_dim: 128
  num_layers: 1
  bidirectional: true
  dropout: 0.3
  pooling: last          # last | mean | max

train:
  batch_size: 128
  epochs: 6
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 5.0
  patience: 2            # early stopping on dev macro-F1

output:
  model_dir: runs/bilstm
