[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewnlp"
version = "0.1.0"
description = "End-to-end hotel review sentiment analysis: classical ML baselines, pure-PyTorch BiLSTM, LoRA implemented from scratch, Qwen2.5 QLoRA fine-tuning, unified benchmarking and FastAPI serving."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Your Name" }]
requires-python = ">=3.10"
keywords = ["nlp", "sentiment-analysis", "lora", "qlora", "pytorch", "huggingface"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "joblib>=1.3",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
llm = [
    "transformers>=4.45",
    "datasets>=3.0",
    "accelerate>=0.34",
    "peft>=0.13",
    "trl>=0.11",
    "bitsandbytes>=0.44",
]
serving = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "locust>=2.20",
]
tracking = [
    "wandb>=0.18",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are exploratory artifacts: allow idiomatic notebook style
# (unsorted/stacked imports, `a; b` one-liners like `plt.tight_layout(); plt.show()`)
# while still catching real bugs (F) and footguns (B) in notebook code.
"notebooks/**/*.ipynb" = ["E401", "E701", "E702", "E703", "I001", "W291", "W293"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
