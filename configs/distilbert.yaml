# DistilBERT full fine-tune - the "standard transformer" midpoint
seed: 42

model:
  name: distilbert-base-uncased
  max_length: 256

train:
  batch_size: 32
  eval_batch_size: 64
  epochs: 2
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  fp16: true             # ignored on CPU

output:
  model_dir: runs/distilbert
