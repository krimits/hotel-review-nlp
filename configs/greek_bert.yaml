# configs/greek_bert.yaml
# ---------------------------------------------------------------------------
# DOMAIN: Greek political-tweets sentiment (Tsakalidis et al. 2018).
# This is a DOMAIN-TRANSFER demo, NOT a hotel-review benchmark.
# ---------------------------------------------------------------------------

model:
  name: "nlpaueb/bert-base-greek-uncased-v1"
  num_labels: 2

data:
  dataset_name: "DGurgurov/greek_sa"
  dataset_revision: "767a5a0737311829f43cb4f4c90a609b6da4ed50"
  text_column: "text"
  label_column: "label"
  test_size: 0.10
  val_size: 0.10
  seed: 42
  max_length: 128
  overlap_policy: "raise"
  duplicate_mode: "group"

baseline:
  max_features: 100000
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.95
  C: 1.0
  max_iter: 1000
  class_weight: "balanced"
  seed: 42

training:
  output_dir: "runs/greek_bert"
  num_epochs: 5
  batch_size: 16
  eval_batch_size: 32
  learning_rate: 2.0e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  fp16: true
  seed: 42
  logging_steps: 50
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "macro_f1"
  early_stopping_patience: 2

evaluation:
  output_dir: "runs/greek_bert/evaluation"
