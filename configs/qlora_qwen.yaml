# Qwen2.5-0.5B-Instruct + QLoRA - the centerpiece LLM fine-tune
# Sized for a free Colab T4 (16 GB): 4-bit base + LoRA adapters.
seed: 42

model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  quantization: "4bit"          # 4bit | none
  max_length: 320

lora:
  # Mirrors the from-scratch implementation in reviewnlp/lora/lora.py
  r: 16
  alpha: 32                     # effective scale = alpha / r = 2.0
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  batch_size: 8
  grad_accum: 4                 # effective batch 32
  epochs: 1
  lr: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  optimizer: paged_adamw_8bit
  grad_checkpointing: true
  # Train on the completion (the label) only, not the prompt.
  train_on_completion_only: true

data:
  processed_dir: data/processed
  # LoRA converges fast; 20k examples is plenty for binary sentiment.
  train_cap: 20000
  dev_cap: 2000

output:
  model_dir: runs/qwen_qlora
  merge_adapter: false          # keep adapter; merge only for 16-bit serving
