name: CI

on:
  # Every branch, so work in progress is checked before any pull request exists.
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff -c requirements/ci.lock
      - run: ruff check src tests scripts spaces

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CPU-only torch keeps CI fast; all tests run offline on tiny fixtures.
      # Every version is pinned by requirements/ci.lock, compiled for Linux and Python 3.11.
      # torch's CPU build comes from PyTorch's index; its dependencies from PyPI, because the
      # PyTorch index does not carry every version the lock pins (filelock, for one).
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -c requirements/ci.lock
      # requirements/ci.in adds the phase 2 transformers stack and the Space demo's Gradio,
      # whose app is imported and run end to end with a stub model.
      - run: pip install -e ".[dev,serving]" -r requirements/ci.in -c requirements/ci.lock
      - run: pytest tests -v
      - run: python scripts/verify_distilbert_handoff.py
